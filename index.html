<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冬毛ミューズ 第1話「はえました」</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0d1319; color:#eef3f8; font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  header { max-width:520px; margin:0 auto; padding:22px 16px 8px; }
  h1 { font-size:20px; margin:0; }
  .sub { color:#8fa3b8; font-size:13px; margin-top:4px; }
  main { max-width:520px; margin:0 auto; padding:0 0 8px; }
  figure.panel { position:relative; margin:0; line-height:0; }
  figure.panel img { width:100%; height:auto; display:block; }
  .bubble { position:absolute; line-height:1.45; font-size:15px; padding:9px 13px; max-width:62%; }
  .bubble.speech { background:#ffffff; color:#18222e; border-radius:16px; box-shadow:0 2px 10px rgba(0,0,0,.35); }
  .bubble.narration { background:rgba(10,18,28,.78); color:#eaf2fa; border-radius:6px; font-size:14px; }
  .end { text-align:center; color:#8fa3b8; font-size:13px; padding:34px 0 46px; }
</style>
</head>
<body>
<header>
  <h1 id="series">ふゆげミューズ</h1>
  <div class="sub" id="title"></div>
  <div class="sub" style="font-size:12px;opacity:.75">縦スクロール漫画の試作ビューアです。</div>
</header>
<main id="main"></main>
<div class="end">― 第1話 おわり ―</div>
<script>
fetch('episode.json').then(r => r.json()).then(ep => {
  document.getElementById('series').textContent = ep.series;
  document.getElementById('title').textContent = ep.title;
  const main = document.getElementById('main');
  for (const p of ep.panels) {
    const fig = document.createElement('figure');
    fig.className = 'panel';
    fig.style.marginBottom = (p.gap_after || 0) + 'px';
    const img = document.createElement('img');
    img.src = p.img; img.alt = '';
    fig.appendChild(img);
    for (const ln of (p.lines || [])) {
      const b = document.createElement('div');
      b.className = 'bubble ' + (ln.kind === 'narration' ? 'narration' : 'speech');
      b.style.left = ln.x + '%';
      b.style.top = ln.y + '%';
      b.textContent = ln.text;
      fig.appendChild(b);
    }
    main.appendChild(fig);
  }
});
</script>
</body>
</html>
