<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冬毛ミューズ 第1話「はえました」</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#ffffff; color:#1c2733; font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; }
  header { max-width:640px; margin:0 auto; padding:20px 16px 14px; }
  h1 { font-size:20px; margin:0; font-weight:800; }
  .sub { color:#7b8a99; font-size:13px; margin-top:4px; }
  main { max-width:640px; margin:0 auto; }
  figure.panel { position:relative; margin:0; line-height:0; }
  figure.panel img { width:100%; height:auto; display:block; }
  .band { display:flex; justify-content:center; align-items:center; }
  .band .narration {
    writing-mode:vertical-rl; font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-weight:800; color:#20506e; letter-spacing:.14em; line-height:1.9;
    text-shadow:0 0 6px #fff,0 0 6px #fff,0 0 3px #fff;
  }
  .bubble { position:absolute; line-height:1.5; }
  .bubble.speech, .bubble.thought {
    background:rgba(255,255,255,.86); color:#1d4e6b;
    border:2px solid #26313d;
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:17px; font-weight:800;
    text-shadow:0 0 3px #fff,0 0 3px #fff;
    padding:16px 12px;
    writing-mode:vertical-rl;
    display:flex; align-items:center; justify-content:center;
    max-height:52%;
  }
  .bubble.speech { border-radius:50%; }
  .bubble.speech::after {
    content:""; position:absolute; width:13px; height:13px;
    background:rgba(255,255,255,.86); border-right:2px solid #26313d; border-bottom:2px solid #26313d;
    transform:rotate(45deg) skew(14deg,14deg);
    bottom:-7px; left:var(--tail,50%); margin-left:-8px;
  }
  .bubble.thought { border-radius:46% 54% 52% 48% / 54% 47% 53% 46%; }
  .bubble.thought::before {
    content:""; position:absolute; width:13px; height:13px; border-radius:50%;
    background:rgba(255,255,255,.86); border:2px solid #26313d;
    bottom:-14px; left:var(--tail,50%); margin-left:-14px;
  }
  .bubble.thought::after {
    content:""; position:absolute; width:7px; height:7px; border-radius:50%;
    background:rgba(255,255,255,.86); border:2px solid #26313d;
    bottom:-24px; left:var(--tail,50%); margin-left:-9px;
  }
  .bubble.sfx {
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-weight:800; color:#20506e; writing-mode:vertical-rl;
    text-shadow:0 0 6px #fff,0 0 6px #fff,0 0 3px #fff;
  }
  .end { text-align:center; color:#7b8a99; font-size:13px; padding:30px 0 44px; }
  footer { text-align:center; color:#a7b4c0; font-size:11px; padding:0 0 26px; }
</style>
</head>
<body>
<header>
  <h1 id="series">ふゆげミューズ</h1>
  <div class="sub" id="title"></div>
</header>
<main id="main"></main>
<div class="end">― 第1話 おわり ―</div>
<nav style="text-align:center;padding:0 0 10px;font-size:14px;"><a href="ep02.html">第2話「かさなる もの」へ →</a></nav>
<footer>縦スクロール漫画ビューアの試作です。台詞と地の文はデータで持ち、ビューアが組みます。</footer>
<script>
fetch('episode.json').then(r => r.json()).then(ep => {
  document.getElementById('series').textContent = ep.series;
  document.getElementById('title').textContent = ep.title;
  const main = document.getElementById('main');
  for (const p of ep.panels) {
    if (p.band) {
      const band = document.createElement('div');
      band.className = 'band';
      band.style.height = p.band.height + 'px';
      band.style.background = p.band.color || '#ffffff';
      const n = document.createElement('div');
      n.className = 'narration';
      n.style.fontSize = (p.band.font || 30) + 'px';
      n.textContent = p.band.text;
      band.appendChild(n);
      main.appendChild(band);
    }
    const fig = document.createElement('figure');
    fig.className = 'panel';
    const img = document.createElement('img');
    img.src = p.img; img.alt = '';
    fig.appendChild(img);
    for (const ln of (p.lines || [])) {
      const b = document.createElement('div');
      b.className = 'bubble ' + (ln.kind || 'speech');
      b.style.left = ln.x + '%';
      b.style.top = ln.y + '%';
      if (ln.size) b.style.fontSize = ln.size + 'px';
      if (ln.rotate) b.style.transform = 'rotate(' + ln.rotate + 'deg)';
      if (ln.tail != null) b.style.setProperty('--tail', ln.tail + '%');
      b.textContent = ln.text;
      fig.appendChild(b);
    }
    main.appendChild(fig);
  }
});
</script>
</body>
</html>
